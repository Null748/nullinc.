
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pictures — nullinc.</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    color: white;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
}

/* HEADER */

header {
    width: 100%;
    padding: 35px 20px 0;
    display: flex;
    justify-content: center;
}

.logo {
    text-decoration: none;
    color: white;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -1px;
    transition: 0.25s;
}

.logo span {
    color: #ff593d;
}

.logo:hover {
    opacity: 0.7;
}

/* TITLE */

.heading {
    text-align: center;
    margin: 65px 20px 45px;
}

.heading h1 {
    font-size: clamp(35px, 6vw, 55px);
    font-weight: 700;
    letter-spacing: -2.5px;
}

.heading p {
    color: #666;
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: 13px;
    text-transform: uppercase;
}

/* GALLERY */

.gallery {
    width: min(1150px, 90%);
    margin: 0 auto 100px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
}

.photo {
    position: relative;
    aspect-ratio: 4 / 5;
    overflow: hidden;
    border-radius: 5px;
    background: #171717;
    border: 1px solid #252525;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    isolation: isolate;
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
    transform: scale(1.04);
    transition: transform 1s ease;
}

/* COVER */

.cover {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: #101010;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
    transition: opacity 0.65s ease, transform 0.65s ease;
}

.cover::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
        circle at center,
        rgba(255, 65, 55, 0.12),
        transparent 65%
    );
    opacity: 0;
    transition: opacity 0.5s ease;
}

.photo.holding .cover::before {
    opacity: 1;
}

/* CIRCULAR TIMER */

.cover-icon {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 1px solid #444;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.cover-icon svg {
    position: absolute;
    inset: -3px;
    width: 64px;
    height: 64px;
    transform: rotate(-90deg);
}

.progress-ring {
    fill: none;
    stroke: #ff593d;
    stroke-width: 2;
    stroke-dasharray: 176;
    stroke-dashoffset: 176;
    stroke-linecap: round;
}

.lock {
    color: #888;
    font-size: 21px;
    transition: color 0.3s, transform 0.3s;
}

.photo.holding .lock {
    color: #ff593d;
    transform: scale(1.12);
}

.cover-text {
    color: #777;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 2px;
    transition: color 0.3s;
}

.photo.holding .cover-text {
    color: #ff725c;
}

/* PROGRESS BAR */

.hold-progress {
    width: 75px;
    height: 2px;
    background: #292929;
    overflow: hidden;
    border-radius: 5px;
}

.hold-progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #ff3939, #ff8738);
}

/* REVEAL */

.photo.revealed .cover {
    opacity: 0;
    transform: scale(1.04);
    pointer-events: none;
}

.photo.revealed img {
    transform: scale(1);
}

.photo.revealed {
    border-color: #ff593d55;
    box-shadow: 0 0 20px #ff39391a;
}

/* FOOTER */

footer {
    text-align: center;
    padding: 25px;
    border-top: 1px solid #1c1c1c;
    color: #555;
    font-size: 9px;
    letter-spacing: 2px;
}

/* MOBILE */

@media (max-width: 750px) {
    .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        width: 94%;
    }
}

@media (max-width: 400px) {
    .gallery {
        grid-template-columns: 1fr;
        width: 88%;
    }
}
</style>
</head>

<body>

<header>
    <a class="logo" href="/real-files/real-home.html">
        null<span>inc.</span>
    </a>
</header>

<section class="heading">
    <h1>Pictures</h1>
    <p>Press and hold to reveal</p>
</section>

<main class="gallery" id="gallery"></main>

<footer>
    NULLINC. © 2026
</footer>

<script>

/* =========================================
   ADD YOUR PHOTOS HERE
   =========================================

   Upload photos to:
   /real-files/pictures/

   Then add their paths below.

*/

const photos = [

    {
        src: "https://p16-dreamina-sign.capcutcdn-us.com/tos-useast8-i-wopfjsm1ax-tx2/af4f5205e1394f26aa48ca9a9283a5b5~tplv-wopfjsm1ax-aigc_resize_mark:360:360.webp?lk3s=8e790bc3&x-expires=1796256000&x-signature=ki1zn%2B%2FUYGOQ%2BHCYNMBM4tE%2FWts%3D",
        alt: "Photo 1"
    },

    {
        src: "https://p16-dreamina-sign.capcutcdn-us.com/tos-useast8-i-wopfjsm1ax-tx2/ff024b0a2a83481cbe470335a22cb358~tplv-wopfjsm1ax-aigc_resize_mark:360:360.webp?lk3s=8e790bc3&x-expires=1796256000&x-signature=cYmoBs72FAKshg5WFJuXgrEX2VI%3D",
        alt: "Photo 2"
    },

    {
        src: "/real-files/pictures/photo3.jpg",
        alt: "Photo 3"
    }

];


/* =========================================
   GALLERY SYSTEM
   ========================================= */

const gallery = document.getElementById("gallery");

const HOLD_DURATION = 1000;

photos.forEach(photo => {

    const card = document.createElement("div");
    card.className = "photo";

    const img = document.createElement("img");
    img.src = photo.src;
    img.alt = photo.alt;
    img.draggable = false;

    const cover = document.createElement("div");
    cover.className = "cover";

    cover.innerHTML = `
        <div class="cover-icon">
            <svg viewBox="0 0 64 64">
                <circle
                    class="progress-ring"
                    cx="32"
                    cy="32"
                    r="28"
                />
            </svg>
            <div class="lock">⌑</div>
        </div>

        <div class="cover-text">HOLD</div>

        <div class="hold-progress">
            <div class="hold-progress-fill"></div>
        </div>
    `;

    card.appendChild(img);
    card.appendChild(cover);
    gallery.appendChild(card);

    let holding = false;
    let startTime = 0;
    let animationFrame = null;

    const ring = cover.querySelector(".progress-ring");
    const text = cover.querySelector(".cover-text");

    function updateProgress() {

        if (!holding) return;

        const elapsed = performance.now() - startTime;
        const progress = Math.min(elapsed / HOLD_DURATION, 1);

        ring.style.strokeDashoffset = 176 - (176 * progress);

        if (progress >= 1) {

            holding = false;

            card.classList.remove("holding");
            card.classList.add("revealed");

            text.textContent = "RELEASE TO HIDE";

            return;
        }

        animationFrame = requestAnimationFrame(updateProgress);
    }

    function startHold(e) {

        if (card.classList.contains("revealed") || holding) return;

        if (e.pointerType === "mouse" && e.button !== 0) return;

        holding = true;
        startTime = performance.now();

        card.classList.add("holding");

        animationFrame = requestAnimationFrame(updateProgress);
    }

    function cancelHold() {

        if (!holding) return;

        holding = false;

        cancelAnimationFrame(animationFrame);

        card.classList.remove("holding");

        ring.style.strokeDashoffset = 176;
    }

    function hidePhoto() {

        cancelHold();

        card.classList.remove("revealed");
        card.classList.remove("holding");

        ring.style.strokeDashoffset = 176;
        text.textContent = "HOLD";
    }

    card.addEventListener("pointerdown", startHold);

    card.addEventListener("pointerup", () => {

        if (card.classList.contains("revealed")) {
            hidePhoto();
        } else {
            cancelHold();
        }

    });

    card.addEventListener("pointerleave", hidePhoto);
    card.addEventListener("pointercancel", hidePhoto);

    card.addEventListener("contextmenu", e => {
        e.preventDefault();
    });

    // Keyboard support

    card.tabIndex = 0;

    card.addEventListener("keydown", e => {

        if (e.code === "Space" && !e.repeat) {
            e.preventDefault();
            startHold({
                pointerType: "keyboard",
                button: 0
            });
        }

    });

    card.addEventListener("keyup", e => {

        if (e.code === "Space") {
            hidePhoto();
        }

    });

    card.addEventListener("blur", hidePhoto);

});

</script>

</body>
</html>
